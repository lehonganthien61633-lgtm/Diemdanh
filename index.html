<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Điểm Danh RFID</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 20px; 
            background-color: #f4f7f6; 
            color: #333; 
        }
        h1 { text-align: center; color: #2c3e50; }
        .container { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 20px; 
            justify-content: center; 
        }
        .box { 
            flex: 1; 
            min-width: 300px; 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
        }
        h2 { 
            color: #2980b9; 
            border-bottom: 2px solid #3498db; 
            padding-bottom: 5px; 
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 15px; 
        }
        th, td { 
            border: 1px solid #ddd; 
            padding: 12px; 
            text-align: left; 
        }
        th { background-color: #3498db; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .unknown { color: #e74c3c; font-weight: bold; }
        .empty-row { text-align: center; color: #7f8c8d; font-style: italic; }
    /* === BỔ SUNG CSS CHO MENU VÀ NÚT === */
        .menu-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        .btn:hover { background-color: #2980b9; }
        .btn-active { background-color: #2c3e50; font-weight: bold; }
        
        .btn-add { background-color: #27ae60; margin-bottom: 15px; }
        .btn-add:hover { background-color: #2ecc71; }
        .btn-add:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        .btn-cancel { background-color: #e74c3c; display: none; margin-left: 10px; }
        .btn-cancel:hover { background-color: #c0392b; }
        .btn-delete { background-color: #f39c12; margin-bottom: 15px; margin-left: 10px; }
        .btn-delete:hover { background-color: #d35400; }
        .btn-confirm { background-color: #c0392b; display: none; margin-left: 10px; }
        .btn-confirm:hover { background-color: #922b21; }
        .checkbox-del { transform: scale(1.5); cursor: pointer; }
        .hide-col { display: none; }
        
        /* Ẩn/Hiện Tab */
        .tab-content { display: none; }
        .tab-active { display: block; }
    </style>
</head>
<body>

    <h1>Dashboard Quản Lý Điểm Danh</h1>
    
    <!-- Menu Điều Hướng Tab -->
    <div class="menu-bar">
        <button id="btnMembers" class="btn btn-active" onclick="switchTab('members')">📋 Danh Sách Thành Viên</button>
        <button id="btnHistory" class="btn" onclick="switchTab('history')">🕒 Lịch Sử Điểm Danh</button>
    </div>
    
    <div class="container">
        <!-- Bảng Thành Viên -->
        <div id="tab-members" class="box tab-content tab-active">
            <h2>Danh Sách Thành Viên</h2>
            <div style="margin-bottom: 15px;">
                <button id="btnAddMember" class="btn btn-add">➕ Thêm Thành Viên Mới</button>
                <button id="btnCancelAdd" class="btn btn-cancel">❌ Hủy thêm</button>
                <button id="btnToggleDelete" class="btn btn-delete">🗑️ Xóa thành viên</button>
                <button id="btnConfirmDelete" class="btn btn-confirm">⚠️ Xác nhận xóa</button>
            </div>
            <p id="addStatus" style="color: #e67e22; font-weight: bold; display: none;">⏳ Đang chờ quét thẻ trên thiết bị (Đèn RGB đang nháy xanh)...</p>
            
            <table>
                <thead>
                    <tr>
                        <th class="delete-col hide-col">Chọn</th>
                        <th>UID Thẻ</th>
                        <th>Họ và Tên</th>
                        <th>Mã Số</th>
                    </tr>
                </thead>
                <tbody id="membersTable">
                    <tr><td colspan="4" class="empty-row">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Bảng Lịch Sử -->
        <div id="tab-history" class="box tab-content">
            <h2>Lịch Sử Điểm Danh (Real-time)</h2>
            <table>
                <thead>
                    <tr>
                        <th>Thời Gian</th>
                        <th>Họ và Tên</th>
                        <th>UID Thẻ</th>
                        <th>Trạng Thái</th>
                    </tr>
                </thead>
                <tbody id="attendanceTable">
                    <tr><td colspan="4" class="empty-row">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Tải Firebase SDK (Modular v9+) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        // Import thêm lệnh 'remove' để xóa dữ liệu
        import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD8UhkdBIf2WF9EWXGaXRAgjLORrT3E450",
            databaseURL: "https://rfid-project-c315c-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "rfid-project-c315c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let membersData = {};
        let isDeleteMode = false;

        // === GIAO DIỆN CHUYỂN TAB ===
        window.switchTab = function(tabName) {
            document.getElementById('tab-members').classList.remove('tab-active');
            document.getElementById('tab-history').classList.remove('tab-active');
            document.getElementById('btnMembers').classList.remove('btn-active');
            document.getElementById('btnHistory').classList.remove('btn-active');

            if(tabName === 'members') {
                document.getElementById('tab-members').classList.add('tab-active');
                document.getElementById('btnMembers').classList.add('btn-active');
            } else {
                document.getElementById('tab-history').classList.add('tab-active');
                document.getElementById('btnHistory').classList.add('btn-active');
            }
        };

        // === CÁC NÚT ĐIỀU KHIỂN ===
        const btnAdd = document.getElementById('btnAddMember');
        const btnCancelAdd = document.getElementById('btnCancelAdd');
        const btnToggleDelete = document.getElementById('btnToggleDelete');
        const btnConfirmDelete = document.getElementById('btnConfirmDelete');
        const addStatus = document.getElementById('addStatus');

        // Bắt đầu quy trình thêm
        btnAdd.addEventListener('click', () => {
            set(ref(db, 'Command/mode'), 1);
            set(ref(db, 'Command/new_uid'), ""); 
            addStatus.style.display = "block";
            btnAdd.style.display = "none";
            btnCancelAdd.style.display = "inline-block";
        });

        // Hủy quy trình thêm
        btnCancelAdd.addEventListener('click', () => {
            set(ref(db, 'Command/mode'), 0);
            set(ref(db, 'Command/new_uid'), ""); 
            addStatus.style.display = "none";
            btnAdd.style.display = "inline-block";
            btnCancelAdd.style.display = "none";
        });

        // Bật/Tắt chế độ Xóa
        btnToggleDelete.addEventListener('click', () => {
            isDeleteMode = !isDeleteMode;
            btnConfirmDelete.style.display = isDeleteMode ? "inline-block" : "none";
            btnToggleDelete.innerText = isDeleteMode ? "🔙 Thoát chế độ xóa" : "🗑️ Xóa thành viên";
            
            // Hiện/Ẩn cột checkbox
            const cols = document.querySelectorAll('.delete-col');
            cols.forEach(col => isDeleteMode ? col.classList.remove('hide-col') : col.classList.add('hide-col'));
        });

        // Xác nhận xóa các thẻ đã đánh dấu
        btnConfirmDelete.addEventListener('click', () => {
            const checkboxes = document.querySelectorAll('.checkbox-del:checked');
            if(checkboxes.length === 0) {
                alert("Vui lòng chọn ít nhất 1 thành viên để xóa!");
                return;
            }
            if(confirm(`Bạn chắc chắn muốn xóa ${checkboxes.length} thành viên? Toàn bộ dữ liệu điểm danh của họ cũng sẽ bị xóa.`)) {
                checkboxes.forEach(cb => {
                    remove(ref(db, 'Members/' + cb.value));
                });
                btnToggleDelete.click(); // Thoát chế độ xóa
            }
        });

        // === LẮNG NGHE THẺ MỚI (CHỐNG TRÙNG LẶP) ===
        onValue(ref(db, 'Command/new_uid'), (snapshot) => {
            const newUid = snapshot.val();
            if (newUid && newUid !== "") {
                // Kiểm tra xem thẻ đã tồn tại chưa
                if (membersData[newUid]) {
                    alert(`Thẻ (UID: ${newUid}) đã tồn tại trong hệ thống! Kết thúc phiên đăng ký.`);
                    btnCancelAdd.click();
                    return;
                }

                addStatus.style.display = "none";
                btnAdd.style.display = "inline-block";
                btnCancelAdd.style.display = "none";
                
                setTimeout(() => {
                    const name = prompt(`Phát hiện thẻ mới (UID: ${newUid})\nNhập Họ và Tên thành viên:`);
                    if (name) {
                        const id = prompt("Nhập Mã Số (MSSV/ID):");
                        set(ref(db, 'Members/' + newUid), {
                            name: name,
                            id: id || "N/A",
                            lastStatus: "Ra" // Thiết lập mặc định để quét lần đầu thành "Vào"
                        });
                        alert("Đã thêm thành viên thành công!");
                    }
                    set(ref(db, 'Command/new_uid'), "");
                }, 500); 
            }
        });

        // === TỔNG HỢP VÀ RENDER DỮ LIỆU ĐỒNG THỜI ===
        onValue(ref(db, 'Members'), (snapshot) => {
            const data = snapshot.val();
            const tbodyMembers = document.getElementById('membersTable');
            const tbodyAtt = document.getElementById('attendanceTable');
            
            tbodyMembers.innerHTML = ""; 
            tbodyAtt.innerHTML = "";
            let allAttendance = []; // Mảng gộp tất cả lịch sử điểm danh
            
            if (data) {
                membersData = data; 
                for (const [uid, info] of Object.entries(data)) {
                    // Render Bảng Thành Viên
                    tbodyMembers.innerHTML += `
                        <tr>
                            <td class="delete-col ${isDeleteMode ? '' : 'hide-col'}"><input type="checkbox" class="checkbox-del" value="${uid}"></td>
                            <td><strong>${uid}</strong></td>
                            <td>${info.name || 'N/A'}</td>
                            <td>${info.id || 'N/A'}</td>
                        </tr>
                    `;

                    // Trích xuất Lịch Sử Điểm Danh của thành viên này
                    if(info.Attendance) {
                        for (const [timestamp, att] of Object.entries(info.Attendance)) {
                            allAttendance.push({
                                timeKey: parseInt(timestamp),
                                timeString: att.time,
                                name: info.name,
                                uid: uid,
                                status: att.status || 'Vào'
                            });
                        }
                    }
                }

                // Render Bảng Lịch Sử
                if(allAttendance.length > 0) {
                    // Sắp xếp thời gian mới nhất lên đầu
                    allAttendance.sort((a, b) => b.timeKey - a.timeKey);
                    allAttendance.forEach(att => {
                        const color = att.status === "Vào" ? "green" : "red";
                        tbodyAtt.innerHTML += `
                            <tr>
                                <td>${att.timeString}</td>
                                <td>${att.name}</td>
                                <td>${att.uid}</td>
                                <td style="color:${color}; font-weight:bold;">${att.status}</td>
                            </tr>
                        `;
                    });
                } else {
                    tbodyAtt.innerHTML = `<tr><td colspan="4" class="empty-row">Chưa có dữ liệu điểm danh</td></tr>`;
                }

            } else {
                membersData = {};
                tbodyMembers.innerHTML = `<tr><td colspan="4" class="empty-row">Chưa có dữ liệu thành viên</td></tr>`;
                tbodyAtt.innerHTML = `<tr><td colspan="4" class="empty-row">Chưa có dữ liệu điểm danh</td></tr>`;
            }
        });
    </script>
</body>
</html>
